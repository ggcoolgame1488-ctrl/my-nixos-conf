# ============================================================
#  kitty.conf — конвертировано из alacritty.toml
#  Положить в ~/.config/kitty/kitty.conf
# ============================================================
 
# --- Шрифты ---
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

confirm_os_window_close 0

# --- Окно ---
# "c" — единица измерения в колонках/строках (нужна kitty >= 0.28)
initial_window_width  100c
initial_window_height 30c
 
# dynamic_padding у kitty нет — есть только статичный отступ
window_padding_width 2
 
# decorations = "Full" -> обычная рамка ОС (аналог по умолчанию)
hide_window_decorations no
 
# opacity 0.8
background_opacity 0.8
# чтобы можно было менять прозрачность на лету (ctrl+shift+a m/l)
dynamic_background_opacity yes
 
# window.title и class/instance в kitty задаются не в конфиге,
# а через флаги запуска:
#   kitty --title "Alacritty@CachyOS" --class Alacritty -o linux_display_server=x11
# либо через .desktop файл.
 
# --- Скроллинг ---
scrollback_lines      10000
wheel_scroll_multiplier 3.0
 
# --- Курсор ---
cursor_shape              underline
cursor_underline_thickness 15
cursor_blink_interval      0
cursor_shape_unfocused     hollow
 
# --- Мышь ---
# hide_when_typing = true (в секундах, 0 = выключено)
mouse_hide_wait 3.0
# копирование выделения сразу в буфер (аналог save_to_clipboard = true)
copy_on_select yes
# средняя кнопка мыши вставляет выделение — это поведение по умолчанию в kitty,
# отдельно настраивать не нужно
 
# --- Автоперезагрузка конфига ---
# kitty сам подхватывает изменения конфига без перезапуска (live_config_reload не нужен)
 
# --- Терминал ---
term xterm-256color
 
# ============================================================
#  Цветовая схема (Nord, взято из твоего alacritty.toml)
# ============================================================
foreground #D8DEE9
background #2E3440
 
# normal colors
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0
 
# bright colors
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4
 
# bold текст ярче обычного (аналог draw_bold_text_with_bright_colors)
bold_is_bright yes
 
# ============================================================
#  Горячие клавиши
# ============================================================
# Стандартные для kitty (уже работают "из коробки", дублировать не нужно):
#   ctrl+shift+v — Paste
#   ctrl+shift+c — Copy
#   shift+page_up / shift+page_down — прокрутка страницы
#   shift+home / shift+end — прокрутка в начало/конец
#   ctrl+shift+backspace — сброс размера шрифта (аналог твоего Ctrl+0)
 
map ctrl+0 change_font_size all 0
 
# Ctrl+L — очистка экрана и скроллбэка (аналог ClearLogNotice + "\f")
map ctrl+l clear_terminal to_cursor active
 
# Поиск по буферу — в Alacritty это Ctrl+Shift+F/B,
# в kitty встроенного поиска нет, нужен kitten "hints" или сторонний
# kitty_scrollback_nvim / kitty-search. Пример с nvim-kitten:
# map ctrl+shift+f launch --stdin-source=@screen_scrollback --stdin-add-formatting nvim -c "call search('', 'c')"
# Раскомментируй и настрой под себя, если нужен поиск.
